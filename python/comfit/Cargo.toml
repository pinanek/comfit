[package]
name = "comfit-python"
version = "0.1.0"
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Comfit bindings for Python"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
comfit = { path = "../../crates/comfit", features = ["all-languages", "render-html", "render-ansi"] }
comfit-themes = { workspace = true, features = ["all-themes"] }
pyo3 = { version = "0.30", features = ["abi3-py311"] }

[build-dependencies]
pyo3-build-config = "0.30"
