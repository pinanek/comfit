<!DOCTYPE html>
<!-- Browser example loading locally built modules and WASM assets from this workspace. -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Comfit local browser example</title>

    <style>
    body {
      max-width: 48rem;
      margin: 3rem auto;
      padding: 0 1rem;
      background: #18181b;
      color: #e4e4e7;
      font-family: system-ui, sans-serif;
    }

    pre {
      padding: 1rem;
      overflow-x: auto;
      background: #27272a;
      line-height: 1.6;
      tab-size: 2;
    }

    .keyword {
      color: #c084fc;
    }
    .string {
      color: #86efac;
    }
    .number {
      color: #fdba74;
    }
    .function {
      color: #93c5fd;
    }
    .comment {
      color: #a1a1aa;
    }
    </style>
  </head>

  <body>
    <main>
      <h1>Comfit local browser example</h1>
      <p id="status" role="status">Loading highlighter...</p>
      <div id="output"></div>
    </main>

    <script type="importmap">
    {
      "imports": {
        "web-tree-sitter": "../node_modules/web-tree-sitter/web-tree-sitter.js"
      }
    }
    </script>

    <script type="module">
    const status = document.querySelector("#status");
    const output = document.querySelector("#output");
    const source = `// Highlighted entirely in your browser
function greet(name) {
  return "Hello, " + name;
}

console.log(greet("world"));`;

    try {
      const [{ initialize, createHighlighter }, { default: javascript }] =
        await Promise
          .all([
            import("../dist/index.js"),
            import("../../wasm-grammars/dist/javascript.js"),
          ]);
      await initialize({
        engine: new URL("../dist/comfit_bg.wasm", import.meta.url),
        treeSitter: new URL("../dist/web-tree-sitter.wasm", import.meta.url),
      });

      const highlighter = await createHighlighter({
        languages: [javascript],
      });

      try {
        output.innerHTML = highlighter.renderHtml(source, "javascript");
        status.textContent = "JavaScript highlighted in your browser.";
      } finally {
        highlighter.dispose();
      }
    } catch (error) {
      status.textContent = `Unable to highlight: ${
        error instanceof Error ? error.message : String(error)
      }`;
      const pre = document.createElement("pre");
      pre.textContent = source;
      output.replaceChildren(pre);
    }
    </script>
  </body>
</html>
