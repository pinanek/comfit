"keyword.function" = { fg = "#ff9492" }
"keyword.import" = { fg = "#ff9492" }
"keyword.modifier" = { fg = "#ff9492" }
"keyword.operator" = { fg = "#ff9492" }
"keyword.repeat" = { fg = "#ff9492" }
"keyword.return" = { fg = "#ff9492" }
"keyword.type" = { fg = "#ff9492" }
label = { fg = "#ffb757" }
"markup.heading" = { fg = "#91cbff", modifiers = ["bold"] }
"markup.heading.1" = { fg = "#91cbff", modifiers = ["bold"] }
