"keyword.coroutine" = { fg = "#a0111f" }
"keyword.debug" = { fg = "#a0111f" }
"keyword.directive" = { fg = "#a0111f" }
"keyword.exception" = { fg = "#a0111f" }
"keyword.function" = { fg = "#a0111f" }
"keyword.import" = { fg = "#a0111f" }
"keyword.modifier" = { fg = "#a0111f" }
"keyword.operator" = { fg = "#a0111f" }
"keyword.repeat" = { fg = "#a0111f" }
"keyword.return" = { fg = "#a0111f" }
"keyword.type" = { fg = "#a0111f" }
label = { fg = "#702c00" }
"markup.heading" = { fg = "#023b95", modifiers = ["bold"] }
"markup.heading.1" = { fg = "#023b95", modifiers = ["bold"] }
"markup.heading.2" = { fg = "#023b95", modifiers = ["bold"] }
"markup.heading.3" = { fg = "#023b95", modifiers = ["bold"] }
"markup.heading.4" = { fg = "#023b95", modifiers = ["bold"] }
"markup.heading.5" = { fg = "#023b95", modifiers = ["bold"] }
"markup.heading.6" = { fg = "#023b95", modifiers = ["bold"] }
"markup.italic" = { fg = "#0e1116", modifiers = ["italic"] }
"markup.link.url" = { modifiers = [], underline = { style = "line" } }
"markup.list" = { fg = "#702c00" }
"markup.quote" = { fg = "#024c1a" }
"markup.raw" = { fg = "#023b95" }
"markup.strikethrough" = { modifiers = ["crossed_out"] }
"markup.strong" = { fg = "#0e1116", modifiers = ["bold"] }
"markup.underline" = { modifiers = [], underline = { style = "line" } }
module = { fg = "#702c00" }
"module.builtin" = { fg = "#023b95" }
number = { fg = "#023b95" }
"number.float" = { fg = "#023b95" }
operator = { fg = "#a0111f" }
property = { fg = "#023b95" }
string = { fg = "#032563" }
