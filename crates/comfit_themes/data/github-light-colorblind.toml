name = "GitHub Light Colorblind"
default = { fg = "#24292f", bg = "#ffffff" }

[styles]
attribute = { fg = "#8a4600" }
"attribute.builtin" = { fg = "#0550ae" }
boolean = { fg = "#0550ae" }
character = { fg = "#b35900" }
comment = { fg = "#6e7781" }
"comment.documentation" = { fg = "#6e7781" }
"comment.error" = { fg = "#6e7781" }
"comment.note" = { fg = "#6e7781" }
"comment.todo" = { fg = "#6e7781" }
"comment.warning" = { fg = "#6e7781" }
constant = { fg = "#0550ae" }
"constant.builtin" = { fg = "#0550ae" }
"constant.macro" = { fg = "#24292f" }
constructor = { fg = "#8a4600" }
"diff.delta" = { fg = "#8a4600", bg = "#ffddb0" }
"diff.minus" = { fg = "#6f3800", bg = "#fff5e8" }
"diff.plus" = { fg = "#0550ae", bg = "#ddf4ff" }
function = { fg = "#8250df" }
"function.builtin" = { fg = "#0550ae" }
"function.call" = { fg = "#8250df" }
