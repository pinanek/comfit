name = "GitHub Light High Contrast"
default = { fg = "#0e1116", bg = "#ffffff" }

[styles]
attribute = { fg = "#702c00" }
"attribute.builtin" = { fg = "#023b95" }
boolean = { fg = "#023b95" }
character = { fg = "#a0111f" }
comment = { fg = "#66707b" }
"comment.documentation" = { fg = "#66707b" }
"comment.error" = { fg = "#66707b" }
"comment.note" = { fg = "#66707b" }
"comment.todo" = { fg = "#66707b" }
"comment.warning" = { fg = "#66707b" }
constant = { fg = "#023b95" }
"constant.builtin" = { fg = "#023b95" }
"constant.macro" = { fg = "#0e1116" }
constructor = { fg = "#702c00" }
"diff.delta" = { fg = "#702c00", bg = "#ffc67b" }
"diff.minus" = { fg = "#6e011a", bg = "#fff0ee" }
"diff.plus" = { fg = "#024c1a", bg = "#d2fedb" }
function = { fg = "#622cbc" }
"function.builtin" = { fg = "#023b95" }
