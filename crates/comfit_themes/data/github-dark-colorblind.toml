"markup.heading.4" = { fg = "#79c0ff", modifiers = ["bold"] }
"markup.heading.5" = { fg = "#79c0ff", modifiers = ["bold"] }
"markup.heading.6" = { fg = "#79c0ff", modifiers = ["bold"] }
"markup.italic" = { fg = "#c9d1d9", modifiers = ["italic"] }
"markup.link.url" = { modifiers = [], underline = { style = "line" } }
"markup.list" = { fg = "#fdac54" }
"markup.quote" = { fg = "#a5d6ff" }
"markup.raw" = { fg = "#79c0ff" }
"markup.strikethrough" = { modifiers = ["crossed_out"] }
"markup.strong" = { fg = "#c9d1d9", modifiers = ["bold"] }
"markup.underline" = { modifiers = [], underline = { style = "line" } }
module = { fg = "#fdac54" }
"module.builtin" = { fg = "#79c0ff" }
number = { fg = "#79c0ff" }
