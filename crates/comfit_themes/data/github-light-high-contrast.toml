tag = { fg = "#024c1a" }
"tag.attribute" = { fg = "#023b95" }
"tag.builtin" = { fg = "#024c1a" }
type = { fg = "#702c00" }
"type.builtin" = { fg = "#023b95" }
"type.definition" = { fg = "#702c00" }
variable = { fg = "#0e1116" }
