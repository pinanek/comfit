[package]
name = "comfit-grammars"
version = "0.1.1"
edition.workspace = true
description = "Comfit parsers and queries for Rust"
homepage.workspace = true
repository.workspace = true
license.workspace = true
include = ["LICENSE", "THIRD_PARTY_NOTICES.txt", "README.md", "build.rs", "src/**", "data/languages.toml", "data/queries/**", "data/grammars/**"]

[dependencies]
tree-sitter-language.workspace = true

[dev-dependencies]
streaming-iterator.workspace = true
tree-sitter.workspace = true

[build-dependencies]
cc.workspace = true
jobserver = "0.1"
prettyplease.workspace = true
quote.workspace = true
syn.workspace = true
toml.workspace = true
tree-sitter-generate.workspace = true
zstd.workspace = true

