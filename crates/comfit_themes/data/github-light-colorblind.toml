"keyword.exception" = { fg = "#b35900" }
"keyword.function" = { fg = "#b35900" }
"keyword.import" = { fg = "#b35900" }
"keyword.modifier" = { fg = "#b35900" }
"keyword.operator" = { fg = "#b35900" }
"keyword.repeat" = { fg = "#b35900" }
"keyword.return" = { fg = "#b35900" }
"keyword.type" = { fg = "#b35900" }
label = { fg = "#8a4600" }
"markup.heading" = { fg = "#0550ae", modifiers = ["bold"] }
"markup.heading.1" = { fg = "#0550ae", modifiers = ["bold"] }
"markup.heading.2" = { fg = "#0550ae", modifiers = ["bold"] }
"markup.heading.3" = { fg = "#0550ae", modifiers = ["bold"] }
"markup.heading.4" = { fg = "#0550ae", modifiers = ["bold"] }
