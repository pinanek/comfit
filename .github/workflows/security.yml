name: Security

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Audit Rust dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: taiki-e/install-action@v2.90.3
        with:
          tool: cargo-audit

      - run: cargo audit

  npm:
    name: Audit npm dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.1
        with:
          version: 12.18.0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "26"

      - run: pnpm audit

  python:
    name: Audit Python dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PYTHON: "3.11"
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: Export locked dependencies
        run: uv export --locked --all-packages --all-groups --no-emit-workspace --output-file "$RUNNER_TEMP/requirements.txt"

      - name: Audit locked dependencies
        run: uvx pip-audit --requirement "$RUNNER_TEMP/requirements.txt" --require-hashes --disable-pip
