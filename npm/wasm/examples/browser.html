<!DOCTYPE html>
<!-- Browser example loading version-pinned packages and explicit WASM assets from CDNs. -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Comfit browser example</title>

    <style>
    body {
      max-width: 48rem;
      margin: 3rem auto;
      padding: 0 1rem;
      background: #18181b;
      color: #e4e4e7;
      font-family: system-ui, sans-serif;
    }

    pre {
      padding: 1rem;
      overflow-x: auto;
      background: #27272a;
      line-height: 1.6;
      tab-size: 2;
    }

    .keyword {
      color: #c084fc;
    }
    .string {
      color: #86efac;
    }
    .number {
      color: #fdba74;
    }
    .function {
      color: #93c5fd;
    }
    .comment {
      color: #a1a1aa;
    }
    </style>
  </head>

  <body>
    <main>
      <h1>Comfit browser example</h1>
      <p id="status" role="status">Loading highlighter...</p>
      <div id="output"></div>
    </main>

    <script type="module">
    const status = document.querySelector("#status");
    const output = document.querySelector("#output");
    const source = `// Highlighted entirely in your browser
function greet(name) {
  return "Hello, " + name;
}

console.log(greet("world"));`;

    try {
      const [{ initialize, createHighlighter }, { default: javascript }] =
        await Promise
          .all([
            import("https://esm.sh/@comfit/wasm@0.1.0"),
            import("https://esm.sh/@comfit/wasm-grammars@0.1.0/javascript"),
          ]);
      await initialize({
        engine:
          "https://cdn.jsdelivr.net/npm/@comfit/wasm@0.1.0/dist/comfit_bg.wasm",
        treeSitter:
          "https://cdn.jsdelivr.net/npm/@comfit/wasm@0.1.0/dist/web-tree-sitter.wasm",
      });

      const highlighter = await createHighlighter({
        languages: [{
          ...javascript,
          wasm:
            "https://cdn.jsdelivr.net/npm/@comfit/wasm-grammars@0.1.0/dist/tree-sitter-javascript.wasm",
        }],
      });

      try {
        output.innerHTML = highlighter.renderHtml(source, "javascript");
        status.textContent = "JavaScript highlighted in your browser.";
      } finally {
        highlighter.dispose();
      }
    } catch (error) {
      status.textContent = `Unable to highlight: ${
        error instanceof Error ? error.message : String(error)
      }`;
      const pre = document.createElement("pre");
      pre.textContent = source;
      output.replaceChildren(pre);
    }
    </script>
  </body>
</html>
