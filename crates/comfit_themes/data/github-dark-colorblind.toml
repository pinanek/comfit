"keyword.debug" = { fg = "#ec8e2c" }
"keyword.directive" = { fg = "#ec8e2c" }
"keyword.exception" = { fg = "#ec8e2c" }
"keyword.function" = { fg = "#ec8e2c" }
"keyword.import" = { fg = "#ec8e2c" }
"keyword.modifier" = { fg = "#ec8e2c" }
"keyword.operator" = { fg = "#ec8e2c" }
"keyword.repeat" = { fg = "#ec8e2c" }
"keyword.return" = { fg = "#ec8e2c" }
"keyword.type" = { fg = "#ec8e2c" }
label = { fg = "#fdac54" }
"markup.heading" = { fg = "#79c0ff", modifiers = ["bold"] }
"markup.heading.1" = { fg = "#79c0ff", modifiers = ["bold"] }
"markup.heading.2" = { fg = "#79c0ff", modifiers = ["bold"] }
