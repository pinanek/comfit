name: Publish Python

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published component tag to retry
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-python-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}

jobs:
  prepare:
    if: startsWith(inputs.tag || github.event.release.tag_name, 'comfit-hl-v')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      published: ${{ steps.status.outputs.published }}

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "26"

      - name: Validate release
        run: |
          gh release view "$RELEASE_TAG" --json isDraft --jq 'if .isDraft then error("Cannot publish a draft") else . end'
          node .github/scripts/publish.mjs select python
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Check existing publication
        id: status
        run: node .github/scripts/publish.mjs status python

  sdist:
    needs: prepare
    if: needs.prepare.outputs.published != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          toolchain: stable
          cache-key: python-sdist

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.15"

      - uses: taiki-e/install-action@v2.90.3
        with:
          tool: tree-sitter-cli@0.27.2

      - name: Build source distribution
        run: |
          cargo grammars update
          cargo notices build python
          uv build --package comfit-hl --sdist --out-dir target/python-sdist

          archive=$(echo target/python-sdist/*.tar.gz)
          directory=$(basename "$archive" .tar.gz)

          mkdir -p target/python-source dist
          tar -xzf "$archive" -C target/python-source

          # Maturin trims workspace members, so refresh the source archive's lockfile too.
          cargo update --workspace --manifest-path "target/python-source/$directory/Cargo.toml"
          tar -czf "dist/$directory.tar.gz" -C target/python-source "$directory"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: python-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  wheels:
    needs: sdist

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            manylinux: musllinux_1_2
            container: quay.io/pypa/musllinux_1_2_x86_64:latest
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            manylinux: musllinux_1_2
            container: quay.io/pypa/musllinux_1_2_aarch64:latest
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.15"
          activate-environment: true
          no-project: true

      - uses: actions/download-artifact@v8.0.2
        with:
          name: python-sdist
          path: dist

      - name: Extract source distribution
        run: |
          mkdir -p target/python-source
          tar -xzf dist/*.tar.gz -C target/python-source --strip-components=1

      - uses: PyO3/maturin-action@v1.51.0
        with:
          maturin-version: "1.16.0"
          sccache: ${{ !endsWith(matrix.target, '-musl') }}
          rust-toolchain: stable
          working-directory: target/python-source
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || '2_28' }}
          container: ${{ matrix.container || '' }}
          args: >-
            --release --locked --out ../../wheels
            --interpreter ${{ runner.os == 'Linux' && '/opt/python/cp311-cp311/bin/python' || 'python' }}
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"

      - name: Test installed wheel
        if: "!endsWith(matrix.target, '-musl')"
        run: |
          for wheel in wheels/*.whl; do
            uv run --no-project python tests/package-python.py --wheel "$wheel"
          done

      - name: Test installed musl wheel on Alpine
        if: endsWith(matrix.target, '-musl')
        run: |
          docker run --rm -v "$PWD:/source:ro" -w /source -e UV_PYTHON=3.15 \
            python:3.15-alpine sh -eu -c '
              pip install --no-cache-dir uv

              for wheel in wheels/*.whl; do
                uv run --no-project python tests/package-python.py --wheel "$wheel"
              done
            '

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: python-wheels-${{ matrix.target }}
          path: wheels/*.whl
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [sdist, wheels]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/comfit-hl

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: python-*
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          packages-dir: dist
          skip-existing: true
