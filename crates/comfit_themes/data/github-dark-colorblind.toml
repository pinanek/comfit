name = "GitHub Dark Colorblind"
default = { fg = "#c9d1d9", bg = "#0d1117" }

[styles]
attribute = { fg = "#fdac54" }
"attribute.builtin" = { fg = "#79c0ff" }
boolean = { fg = "#79c0ff" }
character = { fg = "#ec8e2c" }
comment = { fg = "#8b949e" }
"comment.documentation" = { fg = "#8b949e" }
"comment.error" = { fg = "#8b949e" }
"comment.note" = { fg = "#8b949e" }
"comment.todo" = { fg = "#8b949e" }
"comment.warning" = { fg = "#8b949e" }
constant = { fg = "#79c0ff" }
"constant.builtin" = { fg = "#79c0ff" }
"constant.macro" = { fg = "#c9d1d9" }
constructor = { fg = "#fdac54" }
"diff.delta" = { fg = "#fdac54", bg = "#4e2906" }
"diff.minus" = { fg = "#fdac54", bg = "#331c04" }
"diff.plus" = { fg = "#a5d6ff", bg = "#051d4d" }
function = { fg = "#d2a8ff" }
"function.builtin" = { fg = "#79c0ff" }
