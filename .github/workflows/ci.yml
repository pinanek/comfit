name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build and check
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.1
        with:
          version: 12.18.0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "26"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
          components: clippy, rustfmt
          cache-directories: .grammars/repositories

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.15"
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - uses: taiki-e/install-action@v2.90.3
        with:
          tool: |
            just@1.59.0
            dprint@0.64.3
            tombi@1.10.0
            tree-sitter-cli@0.27.2
            wasm-bindgen-cli@0.2.130

      - name: Install dependencies
        run: just install

      - name: Prepare grammars
        run: cargo grammars update

      - name: Build packages
        run: just build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run checks
        run: just check

      - name: Check grammar features
        run: just test-grammar-features

      - name: Test package archives
        run: just test-packages

      # - name: Build documentation
      #   run: just docs-build
