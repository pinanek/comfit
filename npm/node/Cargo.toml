[package]
name = "comfit-node"
version = "0.1.0"
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Comfit bindings for Node.js"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
comfit = { path = "../../crates/comfit", features = ["all-languages", "render-html", "render-ansi"] }
comfit-themes = { workspace = true, features = ["all-themes"] }
napi = { version = "3", default-features = false, features = ["napi8", "dyn-symbols"] }
napi-derive = "3"

[build-dependencies]
napi-build = "2"
