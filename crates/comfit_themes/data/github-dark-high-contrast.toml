"markup.quote" = { fg = "#72f088" }
"markup.raw" = { fg = "#91cbff" }
"markup.strikethrough" = { modifiers = ["crossed_out"] }
"markup.strong" = { fg = "#f0f3f6", modifiers = ["bold"] }
