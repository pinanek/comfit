[workspace]
members = ["crates/*", "xtask/*", "npm/wasm", "npm/node", "python/comfit"]
resolver = "3"

[workspace.package]
homepage = "https://comfit.pinanek.me"
license = "MIT"
repository = "https://github.com/pinanek/comfit"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.104"
cc = "1.11"
clap = { version = "4.6", features = ["derive"] }
streaming-iterator = "0.1.9"
serde = { version = "1.0.229", features = ["derive"] }
smol_str = "0.3.7"
comfit-internal = { path = "crates/comfit_internal" }
comfit-core = { path = "crates/comfit_core", version = "0.1.0" }
comfit-grammars = { path = "crates/comfit_grammars", version = "0.1.0" }
comfit-themes = { path = "crates/comfit_themes", version = "0.1.0" }
rgb = { version = "0.8", default-features = false }
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
json5 = "1.3"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
serde_json = "1.0.154"
thiserror = "2"
wasm-bindgen = "=0.2.130"

cargo_metadata = "0.23"
rayon = "1.12"
prettyplease = "0.3"
quote = "1"
syn = { version = "3", features = ["full"] }
toml = "1.2.1"
toml_edit = "0.25"

terminal_size = "0.4"
unicode-segmentation = "1.13"
unicode-width = "0.2"

tree-sitter = "0.27.2"
tree-sitter-language = "0.1.9"
tree-sitter-generate = { version = "=0.27.2", default-features = false }
zstd = { version = "0.14", default-features = false }

[profile.release]
lto = true
opt-level = "s"

[profile.dev]
opt-level = 0
debug = 0

[profile.dev.build-override]
opt-level = 3

[profile.release.build-override]
opt-level = 3
