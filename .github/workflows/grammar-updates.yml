name: Grammar updates

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: grammar-updates
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          toolchain: stable

      - name: Check upstream grammar revisions
        run: cargo grammars outdated > "$RUNNER_TEMP/grammar-updates.tsv"

      - name: Create or update report issue
        run: python3 .github/scripts/report-grammar-updates.py "$RUNNER_TEMP/grammar-updates.tsv"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
